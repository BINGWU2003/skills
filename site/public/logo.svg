<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">BINGWU Skills logo</title>
  <desc id="desc">An animated software package representing a portable and installable Agent Skill.</desc>
  <style>
    .mark {
      animation: breathe 5s ease-in-out 2s infinite;
      transform-origin: 256px 256px;
    }

    .stroke {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      opacity: 0;
      animation: draw-loop 4.8s cubic-bezier(.65, 0, .35, 1) infinite;
    }

    .stroke-2 { animation-delay: .22s; }
    .stroke-3 { animation-delay: .44s; }
    .stroke-4 { animation-delay: .66s; }

    @keyframes draw-loop {
      0% {
        opacity: 0;
        stroke-dashoffset: 1;
      }

      8% {
        opacity: 1;
      }

      42%,
      72% {
        opacity: 1;
        stroke-dashoffset: 0;
      }

      92%,
      100% {
        opacity: 0;
        stroke-dashoffset: 0;
      }
    }

    @keyframes breathe {
      0%,
      100% {
        opacity: 1;
        transform: translateY(0);
      }

      50% {
        opacity: .76;
        transform: translateY(-5px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .mark,
      .stroke {
        animation: none;
      }

      .stroke {
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }
  </style>
  <g class="mark" fill="none" stroke="#f5f5f5" stroke-width="23" stroke-linecap="round" stroke-linejoin="round">
    <path class="stroke stroke-1" pathLength="1" d="M256 78 L402 162 L256 246 L110 162 Z" />
    <path class="stroke stroke-2" pathLength="1" d="M110 162 V340 L256 426 V246" />
    <path class="stroke stroke-3" pathLength="1" d="M402 162 V340 L256 426" />
    <path class="stroke stroke-4" pathLength="1" stroke-width="18" d="M210 151 L256 178 L302 151" />
  </g>
</svg>
