<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Handwritten motion template</title>
  <desc id="desc">An original pen exercise demonstrating a signature-style SVG animation.</desc>
  <style>
    .signature {
      animation: breathe 7.2s ease-in-out infinite;
      transform-origin: 256px 256px;
    }

    .stroke {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      opacity: 0;
      animation: write 7.2s cubic-bezier(.65, 0, .35, 1) infinite;
    }

    .stroke-2 { animation-delay: .16s; }

    @keyframes write {
      0% { opacity: 0; stroke-dashoffset: 1; }
      5% { opacity: 1; }
      35%, 80% { opacity: 1; stroke-dashoffset: 0; }
      96% { opacity: 0; stroke-dashoffset: 0; }
      100% { opacity: 0; stroke-dashoffset: 1; }
    }

    @keyframes breathe {
      0%, 100% { transform: translateY(0); }
      58% { transform: translateY(-4px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .signature,
      .stroke { animation: none; }
      .stroke { opacity: 1; stroke-dashoffset: 0; }
    }
  </style>
  <!-- This is a pen exercise, not a finished logo. Replace every path. -->
  <g class="signature" fill="none" stroke="#f5f5f5" stroke-linecap="round" stroke-linejoin="round">
    <path class="stroke stroke-1" pathLength="1" stroke-width="23" d="M88 326 C126 298 140 223 183 206 C218 193 230 232 208 259 C184 289 151 311 165 342 C183 382 244 343 268 303 C294 260 321 224 350 230 C376 236 369 278 348 310 C330 338 329 361 369 354 C387 351 399 342 417 326" />
    <path class="stroke stroke-2" pathLength="1" stroke-width="15" opacity=".62" d="M126 378 C206 400 307 389 399 347" />
  </g>
</svg>
