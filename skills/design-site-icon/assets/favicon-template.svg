<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Favicon template</title>
  <desc id="desc">Replace the sample paths with a simplified website icon.</desc>
  <style>
    :root { color: #111827; }
    @media (prefers-color-scheme: dark) { :root { color: #f5f5f5; } }
  </style>
  <!-- Replace every sample path and verify the result at 16px. -->
  <g fill="none" stroke="currentColor" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <path d="M128 256 H384" />
    <path d="M256 128 V384" />
  </g>
</svg>
